<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PARTS — Match 3</title>
<style>
/* ── Reset & tokens ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0c0c10;
  --surface:   #14141c;
  --surface2:  #1c1c28;
  --border:    rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.18);
  --accent:    #c8a84b;
  --accent-lo: rgba(200,168,75,0.12);
  --text:      rgba(255,255,255,0.90);
  --text-dim:  rgba(255,255,255,0.35);
  --radius:    10px;
  --gap:       3px;
}

body {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
  font-family: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  overflow: hidden;
  user-select: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── Layout shell ───────────────────────────────────────────── */
.shell {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0;
  padding: 14px 12px 8px;
  flex: 1;
}

/* ── Header ─────────────────────────────────────────────────── */
.hdr {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}

.logo {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.score-block {
  text-align: right;
  line-height: 1;
}
.score-label {
  font-size: 0.55rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 2px;
}
#score {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--accent);
  line-height: 1;
}

/* ── Controls ───────────────────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.diff-bar {
  display: flex;
  gap: 4px;
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px;
}

.diff-btn {
  flex: 1;
  padding: 5px 4px;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--text-dim);
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  line-height: 1;
}
.diff-btn.active {
  background: var(--accent);
  color: #0c0c10;
}

/* hint toggle */
.hint-control {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.hint-label {
  font-size: 0.55rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* pill toggle */
.toggle { position: relative; width: 32px; height: 17px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.toggle-track::before {
  content: '';
  position: absolute;
  width: 11px; height: 11px;
  left: 2px; top: 2px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: transform 0.2s, background 0.2s;
}
.toggle input:checked + .toggle-track {
  background: var(--accent-lo);
  border-color: var(--accent);
}
.toggle input:checked + .toggle-track::before {
  transform: translateX(15px);
  background: var(--accent);
}

/* ── Board wrapper ──────────────────────────────────────────── */
.board-wrap {
  position: relative;  /* для шиммер-оверлея */
  flex: 1;
  min-height: 0;
}

#board {
  display: grid;
  gap: var(--gap);
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: calc(100dvh - 160px);
  perspective: 800px;
}

/* ── Cell ───────────────────────────────────────────────────── */
.cell {
  aspect-ratio: 1 / 1;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  background: var(--surface2);
  border: 1px solid var(--border);
  transform-style: preserve-3d;
  will-change: transform, box-shadow;
  transition: box-shadow 0.1s, border-color 0.1s;
}

/* цветовая полоска снизу как идентификатор типа */
.cell::after {
  content: '';
  position: absolute;
  bottom: 0; left: 8%; right: 8%;
  height: 2px;
  border-radius: 1px;
  opacity: 0.7;
  z-index: 3;
}
.gem-1::after  { background: #e05252; }
.gem-2::after  { background: #4a9ede; }
.gem-3::after  { background: #4ecc7a; }
.gem-4::after  { background: #e8a830; }
.gem-5::after  { background: #a86cd4; }
.gem-6::after  { background: #30c4a8; }
.gem-7::after  { background: #e8407a; }
.gem-8::after  { background: #e87830; }
.gem-9::after  { background: #30bcd8; }
.gem-10::after { background: #e84040; }
.gem-11::after { background: #6878d0; }
.gem-12::after { background: #68c870; }

/* лёгкий бордер под цвет типа */
.gem-1  { border-color: rgba(224, 82, 82,  0.28); }
.gem-2  { border-color: rgba( 74,158,222,  0.28); }
.gem-3  { border-color: rgba( 78,204,122,  0.28); }
.gem-4  { border-color: rgba(232,168, 48,  0.28); }
.gem-5  { border-color: rgba(168,108,212,  0.28); }
.gem-6  { border-color: rgba( 48,196,168,  0.28); }
.gem-7  { border-color: rgba(232, 64,122,  0.28); }
.gem-8  { border-color: rgba(232,120, 48,  0.28); }
.gem-9  { border-color: rgba( 48,188,216,  0.28); }
.gem-10 { border-color: rgba(232, 64, 64,  0.28); }
.gem-11 { border-color: rgba(104,120,208,  0.28); }
.gem-12 { border-color: rgba(104,200,112,  0.28); }

.cell img {
  width: 78%;
  height: 78%;
  object-fit: contain;
  pointer-events: none;
  filter: brightness(1.6) contrast(1.05);
  position: relative;
  z-index: 1;
}
.cell .emoji {
  font-size: clamp(0.9rem, 3vw, 1.4rem);
  pointer-events: none;
  z-index: 1;
}

.cell.selected {
  border-color: var(--border-hi);
  box-shadow: 0 0 0 1.5px var(--accent), 0 6px 20px rgba(0,0,0,0.5);
  transform: scale(1.08) translateZ(4px);
  z-index: 10;
}
.cell.swap-ghost {
  opacity: 0.1;
  pointer-events: none;
}
.cell.matched {
  animation: pop 0.28s ease forwards;
  pointer-events: none;
  z-index: 5;
}

/* ── Shimmer on individual hint cells ───────────────────────────
   Класс .hint добавляется двум конкретным ячейкам.
   ::before — скользящий блик (overflow:hidden на .cell клипирует его).
   ::after  — цветная полоска-маркер внизу (не трогаем).
─────────────────────────────────────────────────────────────── */
@keyframes cell-shimmer {
  0%   { transform: translateX(-200%) skewX(-12deg); }
  100% { transform: translateX(200%)  skewX(-12deg); }
}
@keyframes hint-pulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.10); }
  50%       { box-shadow: 0 0 0 2px rgba(255,255,255,0.30), 0 0 14px rgba(255,255,255,0.07); }
}

.cell.hint {
  border-color: rgba(255,255,255,0.30) !important;
  animation: hint-pulse 1.8s ease-in-out infinite;
  /* flat чтобы ::before нормально лежал поверх содержимого */
  transform-style: flat;
}

.cell.hint::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: linear-gradient(
    105deg,
    transparent  15%,
    rgba(255,255,255,0.20) 50%,
    transparent  85%
  );
  animation: cell-shimmer 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

/* ── Animations ─────────────────────────────────────────────── */
@keyframes pop {
  0%   { transform: scale(1);    opacity: 1; }
  40%  { transform: scale(1.2);  opacity: 0.6; filter: brightness(3); }
  100% { transform: scale(0);    opacity: 0; }
}

@keyframes fall-smooth {
  0%   { transform: translateY(var(--fall-from, -60px)); opacity: 0; }
  65%  { opacity: 1; }
  82%  { transform: translateY(3px); }
  100% { transform: translateY(0); opacity: 1; }
}
.cell.fall-in {
  animation: fall-smooth 0.38s cubic-bezier(0.22,1,0.36,1) both;
}

/* ── Flying card ─────────────────────────────────────────────── */
.flying-card {
  position: fixed;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 2000;
  will-change: transform, box-shadow;
  transform-style: preserve-3d;
  background: var(--surface2);
  border: 1px solid var(--border-hi);
  overflow: hidden;
}
.flying-card img {
  width: 78%; height: 78%;
  object-fit: contain;
  filter: brightness(1.6) contrast(1.05);
}
.flying-card .emoji { font-size: clamp(0.9rem,3vw,1.4rem); }

/* ── Combo toast ─────────────────────────────────────────────── */
@keyframes toast-in {
  0%   { transform: translateX(-50%) translateY(-110%); opacity: 0; }
  60%  { transform: translateX(-50%) translateY(4px);   opacity: 1; }
  100% { transform: translateX(-50%) translateY(0);     opacity: 1; }
}
@keyframes toast-out {
  0%   { transform: translateX(-50%) translateY(0);      opacity: 1; }
  100% { transform: translateX(-50%) translateY(-110%);  opacity: 0; }
}

#combo-toast {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%) translateY(-110%);
  opacity: 0;
  pointer-events: none;
  z-index: 600;

  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(16px) saturate(1.6);
  -webkit-backdrop-filter: blur(16px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 0 16px;
  height: 38px;
  white-space: nowrap;
}
#combo-toast.show {
  animation: toast-in 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
#combo-toast.hide {
  animation: toast-out 0.24s ease-in forwards;
}

.combo-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.40);
  line-height: 1;
}
.combo-divider {
  width: 1px;
  height: 14px;
  background: rgba(255,255,255,0.14);
  flex-shrink: 0;
  margin: 0 10px;
}
.combo-value {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--accent);
  line-height: 1;
  text-transform: uppercase;
}

/* ── No-moves modal ──────────────────────────────────────────── */
#no-moves {
  display: none;
  position: fixed; inset: 0;
  background: rgba(12,12,16,0.82);
  align-items: center; justify-content: center;
  z-index: 400;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
#no-moves.visible { display: flex; }

.modal-box {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: 16px;
  padding: 28px 28px 24px;
  width: min(320px, 88vw);
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.modal-title {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.2;
}
.modal-sub {
  font-size: 0.72rem;
  color: var(--text-dim);
  line-height: 1.5;
  margin-top: -12px;
}
.modal-actions {
  display: flex;
  gap: 8px;
}
.btn-primary {
  flex: 1;
  padding: 11px;
  background: var(--accent);
  color: #0c0c10;
  border: none;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}

/* ── Scraper button ──────────────────────────────────────────── */
.scraper-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 0 2px;
  flex-shrink: 0;
}

#scraper-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  height: 36px;
  background: transparent;
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
  font-family: inherit;
}

/* иконка-скребок: два прямоугольника со стрелкой */
#scraper-btn .scraper-icon {
  width: 16px;
  height: 16px;
  position: relative;
  flex-shrink: 0;
  opacity: 0.5;
  transition: opacity 0.15s;
}
#scraper-btn .scraper-icon::before,
#scraper-btn .scraper-icon::after {
  content: '';
  position: absolute;
  background: currentColor;
  border-radius: 1px;
}
/* горизонтальная «лопата» */
#scraper-btn .scraper-icon::before {
  width: 100%; height: 3px;
  top: 5px; left: 0;
}
/* ручка */
#scraper-btn .scraper-icon::after {
  width: 3px; height: 9px;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
}

/* активное состояние */
#scraper-btn.active {
  background: rgba(200, 168, 75, 0.10);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 14px rgba(200,168,75,0.15);
}
#scraper-btn.active .scraper-icon {
  opacity: 1;
}

/* подсветка ячеек при наведении в режиме скребка */
.cell.scraper-hover {
  background: rgba(200, 168, 75, 0.10) !important;
  border-color: rgba(200, 168, 75, 0.45) !important;
  transition: background 0.08s, border-color 0.08s;
}

/* анимация удаления скребком */
@keyframes scrape-out {
  0%   { transform: translateX(0)   scaleY(1); opacity: 1; }
  40%  { transform: translateX(12px) scaleY(0.85); opacity: 0.5; }
  100% { transform: translateX(40px) scaleY(0); opacity: 0; }
}
.cell.scrape-out {
  animation: scrape-out 0.22s ease-in forwards;
  pointer-events: none;
}

/* ── Footer ──────────────────────────────────────────────────── */
footer {
  margin-top: 8px;
  font-size: 0.52rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div class="shell">

  <div class="hdr">
    <span class="logo">Parts</span>
    <div class="score-block">
      <div class="score-label">Score</div>
      <div id="score">0</div>
    </div>
  </div>

  <div class="controls">
    <div class="diff-bar">
      <button class="diff-btn active" data-diff="easy"   onclick="setDifficulty('easy')">Easy</button>
      <button class="diff-btn"        data-diff="normal"  onclick="setDifficulty('normal')">Normal</button>
      <button class="diff-btn"        data-diff="hard"    onclick="setDifficulty('hard')">Hard</button>
      <button class="diff-btn"        data-diff="expert"  onclick="setDifficulty('expert')">Expert</button>
    </div>
    <div class="hint-control">
      <span class="hint-label">Hint</span>
      <label class="toggle">
        <input type="checkbox" id="hint-toggle" checked onchange="onHintToggle()">
        <span class="toggle-track"></span>
      </label>
    </div>
  </div>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <div class="scraper-bar">
    <button id="scraper-btn" onclick="toggleScraper()">
      <span class="scraper-icon"></span>
      Scraper
    </button>
  </div>

  <footer>Tap or swipe to swap</footer>

</div><!-- .shell -->

<!-- combo toast -->
<div id="combo-toast">
  <span class="combo-label">Combo</span>
  <span class="combo-divider"></span>
  <span class="combo-value" id="combo-value">x2</span>
</div>

<!-- no moves modal -->
<div id="no-moves">
  <div class="modal-box">
    <div class="modal-title">No moves left</div>
    <div class="modal-sub">The board will be reshuffled. Your score is kept.</div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="shuffleBoard()">Reshuffle</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const DIFFICULTIES = {
  easy:   { cols: 7, rows: 7, gemTypes: 5  },
  normal: { cols: 8, rows: 8, gemTypes: 7  },
  hard:   { cols: 8, rows: 8, gemTypes: 9  },
  expert: { cols: 9, rows: 9, gemTypes: 12 },
};

const ALL_IMGS = [
  '494858501.png','677190411.png','909212541.png','946006281.png',
  '1023327801.png','1350318051.png','1593794351.png','2489211861.png',
  '2550003631.png','2638402031.png','2899937651.png','3241715591.png',
  '3494283921.png','3503704291.png','3858232881.png','4062681351.png',
  '4469738251.png','4921273661.png','5059758041.png','5081440011.png',
  '5084435091.png','5145193431.png','5147000371.png','5570842761.png',
  '5750286311.png','5753922651.png','5754108431.png','5825793581.png',
  '6156501671.png','6186879891.png','6745924971.png','6938101851.png',
  '7120636581.png','7347299641.png','8074461121.png','8355742941.png',
  '8519968641.png','8540916931.png','8601853291.png','8628014011.png',
  '9186094931.png','9312965381.png',
];
// Картинки лежат в ./textures/ (после запуска copy_textures.ps1)
const IMG_PATH = './textures/';

const GEM_COLORS = [
  '#e05252','#4a9ede','#4ecc7a','#e8a830','#a86cd4','#30c4a8',
  '#e8407a','#e87830','#30bcd8','#e84040','#6878d0','#68c870',
];
const GEM_FALLBACK = ['A','B','C','D','E','F','G','H','I','J','K','L'];

const HINT_IDLE_MS = 4000;

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let COLS, ROWS, GEM_TYPES;
let gemImgs   = [];
let board     = [];
let score     = 0;
let selected  = null;
let busy      = false;
let currentDiff = 'easy';

let hintEnabled = true;
let hintTimer   = null;

const boardEl    = document.getElementById('board');
const scoreEl    = document.getElementById('score');
const comboToast = document.getElementById('combo-toast');
const comboVal   = document.getElementById('combo-value');
const noMovesEl  = document.getElementById('no-moves');
// (hint overlay removed — shimmer is applied directly to cells)

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
function setDifficulty(diff) {
  currentDiff = diff;
  document.querySelectorAll('.diff-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.diff === diff));
  init();
}

function onHintToggle() {
  hintEnabled = document.getElementById('hint-toggle').checked;
  if (!hintEnabled) hideHint();
  else              resetHintTimer();
}

function init() {
  const cfg  = DIFFICULTIES[currentDiff];
  COLS       = cfg.cols;
  ROWS       = cfg.rows;
  GEM_TYPES  = cfg.gemTypes;
  gemImgs    = ALL_IMGS.slice(0, GEM_TYPES).map(f => IMG_PATH + f);

  score    = 0;
  selected = null;
  busy     = false;
  scoreEl.textContent = '0';
  noMovesEl.classList.remove('visible');
  boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;

  hideHint();
  do { board = createBoard(); }
  while (findMatches(board).length > 0 || !hasValidMove(board));

  renderBoard();
  resetHintTimer();
}

function createBoard() {
  return Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => randomGem()));
}
function randomGem() { return Math.floor(Math.random() * GEM_TYPES) + 1; }

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      boardEl.appendChild(createCell(r, c));
  attachPointerEvents();
}

function createCell(r, c) {
  const g   = board[r][c];
  const div = document.createElement('div');
  div.className = `cell gem-${g}`;
  div.dataset.r = r;
  div.dataset.c = c;

  // Пробуем загрузить текстуру — без цифр и лейблов
  const src = gemImgs[g - 1];
  if (src) {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    // если не загрузится — покажем буквенный fallback
    img.onerror = () => {
      if (!div.isConnected) return;
      img.remove();
      const fb = document.createElement('span');
      fb.className = 'emoji';
      fb.textContent = GEM_FALLBACK[g - 1];
      fb.style.cssText = `font-size:clamp(0.7rem,3vw,1.1rem);font-weight:700;color:${GEM_COLORS[g-1]};font-family:monospace;`;
      div.appendChild(fb);
    };
    div.appendChild(img);
  } else {
    const fb = document.createElement('span');
    fb.className = 'emoji';
    fb.textContent = GEM_FALLBACK[g - 1];
    fb.style.cssText = `font-size:clamp(0.7rem,3vw,1.1rem);font-weight:700;color:${GEM_COLORS[g-1]};font-family:monospace;`;
    div.appendChild(fb);
  }

  return div;
}

function getCell(r, c) { return boardEl.children[r * COLS + c] || null; }

function updateCell(r, c) {
  const old = getCell(r, c);
  if (!old) return;
  boardEl.replaceChild(createCell(r, c), old);
}

// ═══════════════════════════════════════════════════════════════
//  CASCADE RENDER — только изменившиеся ячейки
// ═══════════════════════════════════════════════════════════════
function renderCascade(prevBoard) {
  const cellH = getCell(0, 0)?.getBoundingClientRect().height || 42;

  for (let c = 0; c < COLS; c++) {
    // Строим список ненулевых значений в колонке prevBoard (сверху вниз)
    const prevVals = [];
    for (let r = 0; r < ROWS; r++) {
      if (prevBoard[r][c] !== 0) prevVals.push({ val: prevBoard[r][c], row: r });
    }
    // Используем те же значения в новом board снизу вверх (гравитация)
    const usedIdx = {};

    for (let r = 0; r < ROWS; r++) {
      const v    = board[r][c];
      const cell = getCell(r, c);
      if (!cell) continue;

      // Ищем это значение в prevVals начиная с usedIdx[v]
      const startIdx = usedIdx[v] ?? 0;
      let   foundRow = -1;
      for (let i = startIdx; i < prevVals.length; i++) {
        if (prevVals[i].val === v) { foundRow = prevVals[i].row; usedIdx[v] = i + 1; break; }
      }

      if (foundRow === r) continue; // не двигалась

      const fresh = createCell(r, c);
      if (foundRow >= 0) {
        // Упала с foundRow → r
        fresh.style.setProperty('--fall-from', `${(foundRow - r) * (cellH + 3)}px`);
      } else {
        // Новая деталь — падает сверху за пределы поля
        fresh.style.setProperty('--fall-from', `${-(r + 1) * (cellH + 3)}px`);
      }
      fresh.classList.add('fall-in');
      // Небольшой stagger по колонке для красоты
      fresh.style.animationDelay = `${c * 18}ms`;
      boardEl.replaceChild(fresh, cell);
    }
  }
}

// ═══════════════════════════════════════════════════════════════
//  POINTER EVENTS
// ═══════════════════════════════════════════════════════════════
let touchStart      = null;
let eventsAttached  = false;

function attachPointerEvents() {
  if (eventsAttached) return;
  eventsAttached = true;
  boardEl.addEventListener('pointerdown', onDown, { passive: false });
  boardEl.addEventListener('pointermove', onMove, { passive: false });
  boardEl.addEventListener('pointerup',   onUp,   { passive: false });
}

function cellFromPoint(x, y) {
  const el   = document.elementFromPoint(x, y);
  const cell = el?.closest('.cell');
  if (!cell) return null;
  return { r: +cell.dataset.r, c: +cell.dataset.c };
}

function onDown(e) {
  if (busy) return;
  e.preventDefault();
  hideHint();
  const pos = cellFromPoint(e.clientX, e.clientY);
  if (!pos) return;
  touchStart = pos;
  selectCell(pos.r, pos.c);
}
function onMove(e) { if (touchStart && !busy) e.preventDefault(); }
function onUp(e) {
  if (!touchStart || busy) return;
  e.preventDefault();
  const pos = cellFromPoint(e.clientX, e.clientY);
  if (pos && (pos.r !== touchStart.r || pos.c !== touchStart.c)) {
    const dr = pos.r - touchStart.r, dc = pos.c - touchStart.c;
    const nr = touchStart.r + Math.sign(dr) * (Math.abs(dr) >= Math.abs(dc) ? 1 : 0);
    const nc = touchStart.c + Math.sign(dc) * (Math.abs(dc) >  Math.abs(dr) ? 1 : 0);
    if (isInBounds(nr, nc)) { clearSelection(); trySwap(touchStart.r, touchStart.c, nr, nc); }
  }
  touchStart = null;
}

// ═══════════════════════════════════════════════════════════════
//  SELECT & SWAP
// ═══════════════════════════════════════════════════════════════
function selectCell(r, c) {
  if (selected) {
    const { r: sr, c: sc } = selected;
    if (sr === r && sc === c) { clearSelection(); return; }
    if (isNeighbour(sr, sc, r, c)) { clearSelection(); trySwap(sr, sc, r, c); return; }
    clearSelection();
  }
  selected = { r, c };
  getCell(r, c)?.classList.add('selected');
}
function clearSelection() {
  if (selected) getCell(selected.r, selected.c)?.classList.remove('selected');
  selected = null;
}
function isNeighbour(r1,c1,r2,c2) { return Math.abs(r1-r2)+Math.abs(c1-c2)===1; }
function isInBounds(r,c) { return r>=0&&r<ROWS&&c>=0&&c<COLS; }

async function trySwap(r1,c1,r2,c2) {
  busy = true;
  swapData(r1,c1,r2,c2);
  const valid = findMatches(board).length > 0;
  swapData(r1,c1,r2,c2);

  if (!valid) {
    await animateSwap3D(r1,c1,r2,c2, true);
    busy = false;
    resetHintTimer();
    return;
  }

  await animateSwap3D(r1,c1,r2,c2, false);
  swapData(r1,c1,r2,c2);
  updateCell(r1,c1);
  updateCell(r2,c2);

  await processMatches(1);
  busy = false;
  resetHintTimer();
  if (!hasValidMove(board)) noMovesEl.classList.add('visible');
}
function swapData(r1,c1,r2,c2) {
  [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
}

// ═══════════════════════════════════════════════════════════════
//  PSEUDO-3D SWAP ANIMATION
// ═══════════════════════════════════════════════════════════════
async function animateSwap3D(r1,c1,r2,c2, revert) {
  const cell1 = getCell(r1,c1), cell2 = getCell(r2,c2);
  if (!cell1||!cell2) return;

  const rect1 = cell1.getBoundingClientRect();
  const rect2 = cell2.getBoundingClientRect();
  const fly1  = makeFlyingCard(cell1, rect1);
  const fly2  = makeFlyingCard(cell2, rect2);
  document.body.appendChild(fly1);
  document.body.appendChild(fly2);
  cell1.classList.add('swap-ghost');
  cell2.classList.add('swap-ghost');

  const dx  = rect2.left - rect1.left;
  const dy  = rect2.top  - rect1.top;
  const arc = -Math.max(Math.abs(dx), Math.abs(dy)) * 0.28;

  const TL = 95, TM = 190, TD = 80;
  const S  = 1.18;
  const SH0 = '0 2px 6px rgba(0,0,0,0.3)';
  const SH1 = '0 10px 26px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.12)';
  const SH2 = '0 18px 38px rgba(0,0,0,0.65), 0 0 12px rgba(255,255,255,0.08)';
  const o   = (e,d) => ({ duration:d, easing:e, fill:'forwards' });

  const fly = async (el, kfs, dur, ease) =>
    el.animate(kfs, o(ease, dur)).finished;

  // lift
  await Promise.all([
    fly(fly1,[{transform:`scale(1) translateZ(0)`,boxShadow:SH0},{transform:`scale(${S}) translateZ(20px)`,boxShadow:SH1}],TL,'ease-out'),
    fly(fly2,[{transform:`scale(1) translateZ(0)`,boxShadow:SH0},{transform:`scale(${S}) translateZ(20px)`,boxShadow:SH1}],TL,'ease-out'),
  ]);

  // fly forward
  await Promise.all([
    fly(fly1,[
      {transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},
      {transform:`scale(${S}) translateZ(28px) translate(${dx*.5}px,${dy*.5+arc}px)`,boxShadow:SH2,offset:.5},
      {transform:`scale(${S}) translateZ(20px) translate(${dx}px,${dy}px)`,boxShadow:SH1},
    ],TM,'ease-in-out'),
    fly(fly2,[
      {transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},
      {transform:`scale(${S}) translateZ(28px) translate(${-dx*.5}px,${-dy*.5+arc}px)`,boxShadow:SH2,offset:.5},
      {transform:`scale(${S}) translateZ(20px) translate(${-dx}px,${-dy}px)`,boxShadow:SH1},
    ],TM,'ease-in-out'),
  ]);

  // land on new positions
  await Promise.all([
    fly(fly1,[{transform:`scale(${S}) translateZ(20px) translate(${dx}px,${dy}px)`,boxShadow:SH1},{transform:`scale(1) translateZ(0) translate(${dx}px,${dy}px)`,boxShadow:SH0}],TD,'ease-in'),
    fly(fly2,[{transform:`scale(${S}) translateZ(20px) translate(${-dx}px,${-dy}px)`,boxShadow:SH1},{transform:`scale(1) translateZ(0) translate(${-dx}px,${-dy}px)`,boxShadow:SH0}],TD,'ease-in'),
  ]);

  if (revert) {
    await delay(50);
    // lift from new
    await Promise.all([
      fly(fly1,[{transform:`scale(1) translateZ(0) translate(${dx}px,${dy}px)`,boxShadow:SH0},{transform:`scale(${S}) translateZ(20px) translate(${dx}px,${dy}px)`,boxShadow:SH1}],TL,'ease-out'),
      fly(fly2,[{transform:`scale(1) translateZ(0) translate(${-dx}px,${-dy}px)`,boxShadow:SH0},{transform:`scale(${S}) translateZ(20px) translate(${-dx}px,${-dy}px)`,boxShadow:SH1}],TL,'ease-out'),
    ]);
    // fly back
    await Promise.all([
      fly(fly1,[
        {transform:`scale(${S}) translateZ(20px) translate(${dx}px,${dy}px)`,boxShadow:SH1},
        {transform:`scale(${S}) translateZ(28px) translate(${dx*.5}px,${dy*.5+arc}px)`,boxShadow:SH2,offset:.5},
        {transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},
      ],TM,'ease-in-out'),
      fly(fly2,[
        {transform:`scale(${S}) translateZ(20px) translate(${-dx}px,${-dy}px)`,boxShadow:SH1},
        {transform:`scale(${S}) translateZ(28px) translate(${-dx*.5}px,${-dy*.5+arc}px)`,boxShadow:SH2,offset:.5},
        {transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},
      ],TM,'ease-in-out'),
    ]);
    // land original
    await Promise.all([
      fly(fly1,[{transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},{transform:`scale(1) translateZ(0) translate(0,0)`,boxShadow:SH0}],TD,'ease-in'),
      fly(fly2,[{transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},{transform:`scale(1) translateZ(0) translate(0,0)`,boxShadow:SH0}],TD,'ease-in'),
    ]);
  }

  fly1.remove(); fly2.remove();
  cell1.classList.remove('swap-ghost');
  cell2.classList.remove('swap-ghost');
}

function makeFlyingCard(cell, rect) {
  const fly = document.createElement('div');
  fly.className = `flying-card ${[...cell.classList].find(c=>c.startsWith('gem-'))||'gem-1'}`;
  fly.style.cssText = `left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;transform-origin:center center;`;
  fly.innerHTML = cell.innerHTML;
  return fly;
}

// ═══════════════════════════════════════════════════════════════
//  MATCHES & CASCADES
// ═══════════════════════════════════════════════════════════════
function findMatches(b) {
  const set = new Set();
  for (let r=0;r<ROWS;r++){let run=1;for(let c=1;c<COLS;c++){if(b[r][c]===b[r][c-1]){run++;if(run===3){set.add(`${r},${c-2}`);set.add(`${r},${c-1}`);set.add(`${r},${c}`);}else if(run>3)set.add(`${r},${c}`);}else run=1;}}
  for (let c=0;c<COLS;c++){let run=1;for(let r=1;r<ROWS;r++){if(b[r][c]===b[r-1][c]){run++;if(run===3){set.add(`${r-2},${c}`);set.add(`${r-1},${c}`);set.add(`${r},${c}`);}else if(run>3)set.add(`${r},${c}`);}else run=1;}}
  return [...set].map(k=>{const[r,c]=k.split(',');return{r:+r,c:+c};});
}

async function processMatches(combo) {
  const matches = findMatches(board);
  if (!matches.length) return;

  score += matches.length * 10 * combo;
  scoreEl.textContent = score.toLocaleString();
  if (combo > 1) showCombo(combo);

  for (const {r,c} of matches) {
    getCell(r,c)?.classList.add('matched');
    board[r][c] = 0;
  }
  await delay(285);

  const prev = deepCopy(board);
  applyGravity();
  fillBoard();
  renderCascade(prev);
  await delay(420);

  await processMatches(combo + 1);
}

function applyGravity() {
  for (let c=0;c<COLS;c++){let e=ROWS-1;for(let r=ROWS-1;r>=0;r--){if(board[r][c]!==0){board[e][c]=board[r][c];if(e!==r)board[r][c]=0;e--;}}while(e>=0){board[e][c]=0;e--;}}
}
function fillBoard() {
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c]===0)board[r][c]=randomGem();
}

// ═══════════════════════════════════════════════════════════════
//  HINT — шиммер на конкретных двух ячейках
// ═══════════════════════════════════════════════════════════════
function resetHintTimer() {
  hideHint();
  if (!hintEnabled) return;
  hintTimer = setTimeout(showHint, HINT_IDLE_MS);
}

function hideHint() {
  if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  // Снимаем класс hint со всех ячеек
  boardEl.querySelectorAll('.cell.hint').forEach(c => c.classList.remove('hint'));
}

function showHint() {
  if (!hintEnabled || busy) { resetHintTimer(); return; }

  // Ищем первый валидный ход — возвращаем пару ячеек
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c + 1 < COLS) {
        const cp = deepCopy(board);
        [cp[r][c], cp[r][c+1]] = [cp[r][c+1], cp[r][c]];
        if (findMatches(cp).length > 0) {
          applyHint(r, c, r, c + 1);
          return;
        }
      }
      if (r + 1 < ROWS) {
        const cp = deepCopy(board);
        [cp[r][c], cp[r+1][c]] = [cp[r+1][c], cp[r][c]];
        if (findMatches(cp).length > 0) {
          applyHint(r, c, r + 1, c);
          return;
        }
      }
    }
  }
}

function applyHint(r1, c1, r2, c2) {
  const cell1 = getCell(r1, c1);
  const cell2 = getCell(r2, c2);
  if (cell1) cell1.classList.add('hint');
  if (cell2) cell2.classList.add('hint');
}

// ═══════════════════════════════════════════════════════════════
//  VALID MOVES / SHUFFLE
// ═══════════════════════════════════════════════════════════════
function hasValidMove(b) {
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c+1<COLS){const cp=deepCopy(b);[cp[r][c],cp[r][c+1]]=[cp[r][c+1],cp[r][c]];if(findMatches(cp).length>0)return true;}
    if(r+1<ROWS){const cp=deepCopy(b);[cp[r][c],cp[r+1][c]]=[cp[r+1][c],cp[r][c]];if(findMatches(cp).length>0)return true;}
  }
  return false;
}
function deepCopy(b) { return b.map(r=>[...r]); }

function shuffleBoard() {
  noMovesEl.classList.remove('visible');
  do { for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)board[r][c]=randomGem(); }
  while(findMatches(board).length>0||!hasValidMove(board));
  renderBoard();
  busy = false;
  resetHintTimer();
}

// ═══════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════
let comboHideTimer = null;
function showCombo(level) {
  comboVal.textContent = `x${level}`;
  // Сбрасываем предыдущую анимацию
  comboToast.classList.remove('show', 'hide');
  // Форсируем reflow чтобы анимация перезапустилась
  void comboToast.offsetWidth;
  comboToast.classList.add('show');
  if (comboHideTimer) clearTimeout(comboHideTimer);
  comboHideTimer = setTimeout(() => {
    comboToast.classList.remove('show');
    comboToast.classList.add('hide');
  }, 950);
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════════════════════════
//  SCRAPER MODE
//  Игрок проводит по строке или колонке — все детали улетают,
//  сверху падают новые. Режим активируется кнопкой Scraper.
//  Направление (row/col) определяется по первым двум ячейкам свайпа.
// ═══════════════════════════════════════════════════════════════
let scraperActive  = false;   // режим включён?
let scraperDrag    = false;   // идёт ли сейчас свайп
let scraperAxis    = null;    // 'row' | 'col'
let scraperIndex   = null;    // номер строки или колонки
let scraperOrigin  = null;    // {r, c} — начало свайпа
let scraperVisited = new Set(); // ячейки, по которым прошли

const scraperBtn = document.getElementById('scraper-btn');

function toggleScraper() {
  scraperActive = !scraperActive;
  scraperBtn.classList.toggle('active', scraperActive);
  clearScraperHighlight();
  // В режиме скребка отключаем стандартные hint-таймеры
  if (scraperActive) clearHint();
  else               resetHintTimer();
}

function clearScraperHighlight() {
  boardEl.querySelectorAll('.cell.scraper-hover')
         .forEach(c => c.classList.remove('scraper-hover'));
  scraperDrag    = false;
  scraperAxis    = null;
  scraperIndex   = null;
  scraperOrigin  = null;
  scraperVisited = new Set();
}

// ── Pointer handlers для режима скребка ──────────────────────
// Они подключены к boardEl вместе с обычными, но срабатывают
// только когда scraperActive === true.

function scraperDown(e) {
  if (!scraperActive || busy) return;
  const pos = cellFromPoint(e.clientX, e.clientY);
  if (!pos) return;
  scraperDrag   = true;
  scraperOrigin = pos;
  scraperAxis   = null;    // пока не знаем направление
  scraperIndex  = null;
  scraperVisited.clear();
  highlightScraperCell(pos.r, pos.c);
}

function scraperMove(e) {
  if (!scraperDrag || !scraperActive || busy) return;
  e.preventDefault();
  const pos = cellFromPoint(e.clientX, e.clientY);
  if (!pos) return;

  // Определяем ось по первому смещению
  if (scraperAxis === null && scraperOrigin) {
    const dr = Math.abs(pos.r - scraperOrigin.r);
    const dc = Math.abs(pos.c - scraperOrigin.c);
    if (dr === 0 && dc === 0) return;          // не сдвинулись
    if (dr >= dc) {
      scraperAxis  = 'col';
      scraperIndex = scraperOrigin.c;
    } else {
      scraperAxis  = 'row';
      scraperIndex = scraperOrigin.r;
    }
  }
  if (scraperAxis === null) return;

  // Подсвечиваем ячейки вдоль оси
  if (scraperAxis === 'row') highlightScraperCell(scraperIndex, pos.c);
  else                       highlightScraperCell(pos.r, scraperIndex);
}

async function scraperUp(e) {
  if (!scraperDrag || !scraperActive || busy) return;
  scraperDrag = false;

  if (scraperAxis === null || scraperIndex === null) {
    clearScraperHighlight();
    return;
  }

  // Нужно пройти хотя бы 3 ячейки чтобы засчитать
  if (scraperVisited.size < 3) {
    clearScraperHighlight();
    return;
  }

  busy = true;

  // Анимация вылета
  const cells = scraperAxis === 'row'
    ? Array.from({ length: COLS }, (_, c) => getCell(scraperIndex, c))
    : Array.from({ length: ROWS }, (_, r) => getCell(r, scraperIndex));

  cells.forEach((cell, i) => {
    if (!cell) return;
    cell.classList.remove('scraper-hover');
    // stagger: каждая следующая чуть позже
    cell.style.animationDelay = `${i * 28}ms`;
    cell.classList.add('scrape-out');
  });

  await delay(220 + COLS * 28);

  // Обнуляем строку/колонку в данных
  if (scraperAxis === 'row') {
    for (let c = 0; c < COLS; c++) board[scraperIndex][c] = 0;
  } else {
    for (let r = 0; r < ROWS; r++) board[r][scraperIndex] = 0;
  }

  clearScraperHighlight();

  // Гравитация + заполнение + плавный каскад
  const prev = deepCopy(board);
  applyGravity();
  fillBoard();
  renderCascade(prev);
  await delay(420);

  // Проверяем матчи, которые могли возникнуть
  await processMatches(1);

  // Автовыключаем скребок после использования
  scraperActive = false;
  scraperBtn.classList.remove('active');

  busy = false;
  resetHintTimer();
  if (!hasValidMove(board)) noMovesEl.classList.add('visible');
}

function highlightScraperCell(r, c) {
  const key = `${r},${c}`;
  if (scraperVisited.has(key)) return;
  scraperVisited.add(key);
  const cell = getCell(r, c);
  if (cell) cell.classList.add('scraper-hover');
}

// ── Подключаем scraper-события к тому же boardEl ─────────────
// Используем фазу capture чтобы перехватывать до обычных хендлеров
boardEl.addEventListener('pointerdown', (e) => {
  if (scraperActive) { e.stopImmediatePropagation(); scraperDown(e); }
}, { capture: true, passive: false });

boardEl.addEventListener('pointermove', (e) => {
  if (scraperActive && scraperDrag) { e.stopImmediatePropagation(); scraperMove(e); }
}, { capture: true, passive: false });

boardEl.addEventListener('pointerup', (e) => {
  if (scraperActive) { e.stopImmediatePropagation(); scraperUp(e); }
}, { capture: true, passive: false });

// ── Start ──
init();
</script>
</body>
