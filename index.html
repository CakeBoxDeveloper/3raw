<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Детали</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0c0c10;
  --surface:   #14141c;
  --surface2:  #1a1a26;
  --border:    rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.16);
  --accent:    #c8a84b;
  --accent-lo: rgba(200,168,75,0.12);
  --danger:    #e05252;
  --text:      rgba(255,255,255,0.88);
  --text-dim:  rgba(255,255,255,0.32);
  --r:         3px;
  --gap:       3px;
}

body {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  max-height: 100dvh;
  font-family: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  overflow: hidden;
  user-select: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

/* ══ Shell ══════════════════════════════════════════════════════ */
.shell {
  width: 100%;
  max-width: 560px;
  display: flex;
  flex-direction: column;
  padding: 8px 8px 4px;
  flex: 1;
  min-height: 0;
  height: 100dvh;
}

/* ══ Header ═════════════════════════════════════════════════════ */
.hdr {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin-bottom: 6px;
  flex-shrink: 0;
}
/* таймер — левая колонка */
.move-timer-wrap {
  justify-self: start;
}
/* подсказка — строго по центру */
.hint-control {
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 7px;
}
.hint-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
}
/* счёт — правая колонка */
.score-block {
  justify-self: end;
  text-align: right;
  line-height: 1;
  flex-shrink: 0;
}
.score-label {
  font-size: 0.5rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 1px;
}
#score {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--accent);
  line-height: 1;
}

/* ── Круговой таймер ── */
.move-timer-wrap {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ring-timer {
  position: relative;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
}
.ring-timer svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.ring-bg {
  fill: none;
  stroke: var(--surface2);
  stroke-width: 3;
}
.ring-fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.9s linear, stroke 0.3s;
  /* circumference = 2π × r = 2π × 17 ≈ 106.8 */
  stroke-dasharray: 106.8;
  stroke-dashoffset: 0;
}
.ring-fill.warn { stroke: var(--danger); }
.ring-val {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  transition: color 0.3s;
  line-height: 1;
}
.ring-val.warn { color: var(--danger); }

/* hint toggle */
.toggle { position: relative; width: 42px; height: 22px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.toggle-track::before {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  left: 3px; top: 3px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: transform 0.2s, background 0.2s;
}
.toggle input:checked + .toggle-track { background: var(--accent-lo); border-color: var(--accent); }
.toggle input:checked + .toggle-track::before { transform: translateX(20px); background: var(--accent); }

/* ══ Board ══════════════════════════════════════════════════════ */
.board-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
}
#board {
  display: grid;
  gap: var(--gap);
  width: 100%;
  height: 100%;
  perspective: 800px;
}

/* ══ Cell ═══════════════════════════════════════════════════════ */
.cell {
  border-radius: var(--r);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  background: var(--surface2);
  border: 1px solid var(--border);
  transform-style: preserve-3d;
  will-change: transform, box-shadow;
  transition: box-shadow 0.1s, border-color 0.1s;
  min-width: 0; min-height: 0;
}
.cell img {
  height: 70%;
  width: auto;
  max-width: 86%;
  object-fit: contain;
  pointer-events: none;
  filter: brightness(1.6) contrast(1.05);
  position: relative;
  z-index: 1;
}
.cell .fb {
  font-size: clamp(0.7rem, 3vw, 1.1rem);
  font-weight: 700;
  font-family: monospace;
  pointer-events: none;
  z-index: 1;
}
.cell.selected {
  border-color: var(--border-hi);
  box-shadow: 0 0 0 1.5px var(--accent), 0 4px 14px rgba(0,0,0,0.5);
  transform: scale(1.08) translateZ(4px);
  z-index: 10;
}
.cell.swap-ghost { opacity: 0.1; pointer-events: none; }
.cell.matched {
  animation: pop 0.28s ease forwards;
  pointer-events: none; z-index: 5;
}

/* Шиммер-подсказка */
@keyframes cell-shimmer {
  0%   { transform: translateX(-200%) skewX(-12deg); }
  100% { transform: translateX(200%)  skewX(-12deg); }
}
@keyframes hint-pulse {
  0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
  50%     { box-shadow: 0 0 0 2px rgba(255,255,255,0.26), 0 0 12px rgba(255,255,255,0.05); }
}
.cell.hint {
  border-color: rgba(255,255,255,0.28) !important;
  animation: hint-pulse 1.8s ease-in-out infinite;
  transform-style: flat;
}
.cell.hint::before {
  content: '';
  position: absolute; inset: 0;
  z-index: 4; pointer-events: none;
  background: linear-gradient(105deg, transparent 15%, rgba(255,255,255,0.18) 50%, transparent 85%);
  animation: cell-shimmer 1.8s cubic-bezier(0.4,0,0.2,1) infinite;
}

/* Скребок */
.cell.scraper-hover {
  background: rgba(200,168,75,0.10) !important;
  border-color: rgba(200,168,75,0.40) !important;
}
@keyframes scrape-out {
  0%   { transform: translateX(0)    scaleY(1);    opacity: 1; }
  40%  { transform: translateX(12px) scaleY(0.85); opacity: 0.5; }
  100% { transform: translateX(40px) scaleY(0);    opacity: 0; }
}
.cell.scrape-out { animation: scrape-out 0.22s ease-in forwards; pointer-events: none; }

/* Вспышка при истечении таймера */
@keyframes cell-flash {
  0%,100% { background: var(--surface2); }
  50%     { background: rgba(224,82,82,0.18); }
}
.cell.timer-flash { animation: cell-flash 0.4s ease 2; }

/* Анимации */
@keyframes pop {
  0%   { transform: scale(1);   opacity: 1; }
  40%  { transform: scale(1.2); opacity: 0.6; filter: brightness(3); }
  100% { transform: scale(0);   opacity: 0; }
}
@keyframes fall-smooth {
  0%   { transform: translateY(var(--fall-from,-60px)); opacity: 0; }
  65%  { opacity: 1; }
  82%  { transform: translateY(3px); }
  100% { transform: translateY(0); opacity: 1; }
}
.cell.fall-in { animation: fall-smooth 0.36s cubic-bezier(0.22,1,0.36,1) both; }

/* ══ Flying card ═════════════════════════════════════════════════ */
.flying-card {
  position: fixed;
  border-radius: var(--r);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 2000;
  will-change: transform, box-shadow;
  transform-style: preserve-3d;
  background: var(--surface2);
  border: 1px solid var(--border-hi);
  overflow: hidden;
}
.flying-card img { height: 70%; width: auto; max-width: 86%; object-fit: contain; filter: brightness(1.6) contrast(1.05); }
.flying-card .fb { font-size: clamp(0.7rem,3vw,1.1rem); font-weight: 700; font-family: monospace; }

/* ══ Order bar (под полем) ═══════════════════════════════════════ */
.order-bar {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-top: 5px;
  overflow: hidden;
  height: 52px;       /* фиксированная высота */
  position: relative;
}

/* жёлтая заливка прогресса — абсолютный слой под текстом */
.order-fill-bg {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: var(--accent);
  transition: width 0.35s ease;
  pointer-events: none;
  z-index: 0;
}

/* контент поверх заливки */
.order-content {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  height: 100%;
}

/* текст цвета фона страницы — имитация дырки */
.order-text-wrap {
  flex: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.order-name {
  font-size: 1rem;
  font-weight: 600;
  color: rgba(255,255,255,0.88);
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.order-count {
  font-size: 1rem;
  font-weight: 700;
  color: rgba(255,255,255,0.88);
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.order-preview {
  width: 44px; height: 44px;
  border-radius: var(--r);
  background: var(--surface2);
  border: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  position: relative;
  z-index: 2;
}
.order-preview img {
  width: 88%; height: 88%;
  object-fit: contain;
  filter: brightness(1.5) contrast(1.05);
}
.order-preview .fb {
  font-size: 1.1rem; font-weight: 700; font-family: monospace;
}

/* Режим отдыха */
.order-rest {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
}
.rest-label {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}
#rest-countdown {
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  min-width: 2ch;
  text-align: center;
}

/* ══ Scraper bar ═════════════════════════════════════════════════ */
.scraper-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px 0 2px;
  flex-shrink: 0;
}
#scraper-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 0 14px; height: 32px;
  background: transparent;
  border: 1px solid var(--border-hi);
  border-radius: var(--r);
  color: var(--text-dim);
  font-size: 0.58rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  cursor: pointer; font-family: inherit;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
}
#scraper-btn .sc-icon { width: 14px; height: 14px; position: relative; flex-shrink: 0; opacity: 0.5; transition: opacity 0.15s; }
#scraper-btn .sc-icon::before,
#scraper-btn .sc-icon::after { content: ''; position: absolute; background: currentColor; border-radius: 1px; }
#scraper-btn .sc-icon::before { width: 100%; height: 2px; top: 5px; left: 0; }
#scraper-btn .sc-icon::after  { width: 2px; height: 8px; bottom: 0; left: 50%; transform: translateX(-50%); }
#scraper-btn.active { background: var(--accent-lo); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#scraper-btn.active .sc-icon { opacity: 1; }

/* ══ Toast system ════════════════════════════════════════════════ */
@keyframes toast-in  { 0%{transform:translateX(-50%) translateY(-110%);opacity:0} 60%{transform:translateX(-50%) translateY(4px);opacity:1} 100%{transform:translateX(-50%) translateY(0);opacity:1} }
@keyframes toast-out { 0%{transform:translateX(-50%) translateY(0);opacity:1} 100%{transform:translateX(-50%) translateY(-110%);opacity:0} }

.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%) translateY(-110%);
  opacity: 0;
  pointer-events: none;
  z-index: 600;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(16px) saturate(1.6);
  -webkit-backdrop-filter: blur(16px) saturate(1.6);
  border: 1px solid rgba(255,255,255,0.11);
  border-radius: var(--r);
  display: flex; align-items: center;
  padding: 0 14px; height: 36px;
  white-space: nowrap; gap: 0;
}
.toast.show { animation: toast-in  0.38s cubic-bezier(0.22,1,0.36,1) forwards; }
.toast.hide { animation: toast-out 0.24s ease-in forwards; }

/* Combo toast */
#combo-toast { top: 12px; }
.t-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.38); line-height: 1; }
.t-div   { width: 1px; height: 13px; background: rgba(255,255,255,0.12); margin: 0 9px; flex-shrink: 0; }
.t-val   { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); line-height: 1; }

/* New gem toast */
#gem-toast { top: 56px; }
#gem-toast .t-val { color: var(--text); font-size: 0.6rem; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

/* ══ Modal ═══════════════════════════════════════════════════════ */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(12,12,16,0.82);
  align-items: center; justify-content: center;
  z-index: 400;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.modal-bg.visible { display: flex; }
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--r);
  padding: 24px 24px 20px;
  width: min(300px, 88vw);
  display: flex; flex-direction: column; gap: 16px;
}
.modal-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.modal-sub   { font-size: 0.68rem; color: var(--text-dim); line-height: 1.5; margin-top: -8px; }

/* ── Preview modal ── */
.preview-box {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--r);
  padding: 24px;
  width: min(320px, 88vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.preview-img-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface2);
  border-radius: var(--r);
  overflow: hidden;
}
.preview-img-wrap img {
  width: 86%;
  height: 86%;
  object-fit: contain;
  filter: brightness(1.7) contrast(1.08);
}
.preview-img-wrap .fb {
  font-size: 4rem;
  font-weight: 700;
  font-family: monospace;
}
.preview-name {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  text-align: center;
  word-break: break-all;
}
.preview-close {
  position: absolute;
  top: 10px; right: 10px;
  width: 28px; height: 28px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text-dim);
  font-size: 0.75rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
  font-family: inherit;
}
.preview-close:hover { color: var(--text); border-color: var(--border-hi); }
.btn-primary {
  padding: 10px; background: var(--accent); color: #0c0c10;
  border: none; border-radius: var(--r);
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; cursor: pointer; font-family: inherit;
}

footer {
  margin-top: 3px;
  font-size: 0.46rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-dim); text-align: center; flex-shrink: 0; padding-bottom: 3px;
}
</style>
</head>
<body>

<div class="shell">

  <!-- Header: таймер хода | очки -->
  <div class="hdr">
    <div class="move-timer-wrap">
      <div class="ring-timer">
        <svg viewBox="0 0 44 44">
          <circle class="ring-bg"   cx="22" cy="22" r="17"/>
          <circle class="ring-fill" id="ring-fill" cx="22" cy="22" r="17"/>
        </svg>
        <div class="ring-val" id="timer-val">60</div>
      </div>
    </div>

    <div class="hint-control">
      <span class="hint-label">Подсказка</span>
      <label class="toggle">
        <input type="checkbox" id="hint-toggle" onchange="onHintToggle()">
        <span class="toggle-track"></span>
      </label>
    </div>

    <div class="score-block">
      <div id="score">0</div>
    </div>
  </div>

  <!-- Поле -->
  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <!-- Плашка заказа -->
  <div class="order-bar" id="order-bar">
    <!-- Заполняется JS -->
  </div>

  <!-- Скребок (временно отключён)
  <div class="scraper-bar">
    <button id="scraper-btn" onclick="toggleScraper()">
      <span class="sc-icon"></span>
      Скребок
    </button>
  </div>
  -->

</div>

<!-- Combo toast -->
<div class="toast" id="combo-toast">
  <span class="t-label">Комбо</span>
  <span class="t-div"></span>
  <span class="t-val" id="combo-val">×2</span>
</div>

<!-- New gem toast -->
<div class="toast" id="gem-toast">
  <span class="t-label">Новая деталь</span>
  <span class="t-div"></span>
  <span class="t-val" id="gem-toast-name"></span>
</div>

<!-- No moves modal -->
<div class="modal-bg" id="no-moves">
  <div class="modal-box">
    <div class="modal-title">Нет ходов</div>
    <div class="modal-sub">Поле перемешается. Очки сохраняются.</div>
    <button class="btn-primary" onclick="shuffleBoard()">Перемешать</button>
  </div>
</div>

<!-- Preview modal -->
<div class="modal-bg" id="preview-modal" onclick="closePreview()">
  <div class="preview-box" onclick="event.stopPropagation()">
    <div class="preview-img-wrap" id="preview-img-wrap"></div>
    <div class="preview-name" id="preview-name"></div>
    <button class="preview-close" onclick="closePreview()">✕</button>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
//  КОНСТАНТЫ
// ═══════════════════════════════════════════════════════════════
const COLS = 5, ROWS = 7;   // постоянный размер поля

// Начало: 3 типа деталей. Каждые POOL_STEP очков — новый тип (до 40).
// Новая деталь появляется не чаще чем раз в 500 очков.
const POOL_START = 3;
const POOL_MAX   = 40;
const POOL_STEP  = 500;   // очков до следующей детали

// Таймер хода (секунды).
// Старт: 60с. Каждая новая деталь в пуле убирает 1с.
// При 40 деталях в пуле: 60 - (40-3) = 23 → минимум 20с.
const MOVE_TIME_BASE  = 60;   // секунд при 3 деталях
const MOVE_TIME_MIN   = 20;   // абсолютный минимум

// Заказ: сколько деталей нужно собрать
const ORDER_MIN = 15;
const ORDER_MAX = 40;

// Режим отдыха между заказами (секунды)
const REST_TIME = 30;

const IMG_PATH = './textures/';

// ALL_IMGS и ALL_NAMES загружаются из gem_names.json (создан extract_names.py)
// Формат: { "название детали": "файл.png", ... }
let ALL_IMGS  = [];   // ['файл.png', ...]  — пути к текстурам
let ALL_NAMES = [];   // ['название', ...]  — человекочитаемые имена

const GEM_COLORS   = ['#e05252','#4a9ede','#4ecc7a','#e8a830','#a86cd4','#30c4a8','#e8407a','#e87830','#30bcd8','#e84040','#6878d0','#68c870'];
const GEM_FALLBACK = ['A','B','C','D','E','F','G','H','I','J','K','L'];
const HINT_IDLE_MS = 10000;  // 10 сек бездействия

// ═══════════════════════════════════════════════════════════════
//  СОСТОЯНИЕ
// ═══════════════════════════════════════════════════════════════
let board     = [];
let score     = 0;
let selected  = null;
let busy      = false;

// Прогрессивный пул
let GEM_TYPES  = POOL_START;   // сколько типов сейчас активно
let gemImgs    = [];            // URL картинок для активных типов

// Таймер хода
let moveTimeMax    = MOVE_TIME_BASE;
let moveTimeLeft   = MOVE_TIME_BASE;
let moveTimerInt   = null;      // setInterval

// Заказ
let orderGem      = 1;          // какой тип детали нужен (1-based)
let orderTotal    = 0;          // сколько нужно собрать
let orderDone     = 0;          // сколько уже собрано
let ordersCompleted = 0;        // сколько заказов выполнено всего
let isRest        = false;      // режим отдыха
let restLeft      = 0;
let restInt       = null;

// Подсказка
let hintEnabled  = false;  // по умолчанию выключена
let hintTimer    = null;

// ══ DOM ══════════════════════════════════════════════════════════
const boardEl    = document.getElementById('board');
const scoreEl    = document.getElementById('score');
const timerVal   = document.getElementById('timer-val');
const noMovesEl  = document.getElementById('no-moves');
const orderBarEl = document.getElementById('order-bar');
const comboToast = document.getElementById('combo-toast');
const comboVal   = document.getElementById('combo-val');
const gemToast   = document.getElementById('gem-toast');
const gemToastNm = document.getElementById('gem-toast-name');

// ═══════════════════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ
// ═══════════════════════════════════════════════════════════════
function init() {
  GEM_TYPES = POOL_START;
  refreshGemImgs();
  score     = 0;
  selected  = null;
  busy      = false;
  ordersCompleted = 0;
  scoreEl.textContent = '0';
  noMovesEl.classList.remove('visible');
  boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  boardEl.style.gridTemplateRows    = `repeat(${ROWS}, 1fr)`;

  stopMoveTimer();
  stopRest();
  hideHint();

  do { board = createBoard(); }
  while (findMatches(board).length > 0 || !hasValidMove(board));

  renderBoard();
  startNewOrder();
  startMoveTimer();
  resetHintTimer();
}

function refreshGemImgs() {
  // Берём первые GEM_TYPES записей. IMG_PATH уже включён в значение JSON.
  gemImgs = ALL_IMGS.slice(0, GEM_TYPES).map(f => IMG_PATH + f);
}

function createBoard() {
  return Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => randomGem()));
}
function randomGem() { return Math.floor(Math.random() * GEM_TYPES) + 1; }

// ═══════════════════════════════════════════════════════════════
//  ТАЙМЕР ХОДА
// ═══════════════════════════════════════════════════════════════
function startMoveTimer() {
  stopMoveTimer();
  // 60с при 3 деталях, -1с за каждую новую деталь, минимум 20с
  moveTimeMax  = Math.max(MOVE_TIME_MIN, MOVE_TIME_BASE - (GEM_TYPES - POOL_START));
  moveTimeLeft = moveTimeMax;
  renderTimer();

  moveTimerInt = setInterval(() => {
    moveTimeLeft--;
    renderTimer();
    if (moveTimeLeft <= 0) {
      stopMoveTimer();
      onTimerExpired();
    }
  }, 1000);
}

function stopMoveTimer() {
  if (moveTimerInt) { clearInterval(moveTimerInt); moveTimerInt = null; }
}

function resetMoveTimer() {
  stopMoveTimer();
  startMoveTimer();
}

function renderTimer() {
  const pct  = moveTimeLeft / moveTimeMax;
  const warn = moveTimeLeft <= Math.max(5, Math.round(moveTimeMax * 0.2));
  const CIRC = 106.8;   // 2π × 17

  timerVal.textContent = moveTimeLeft;
  timerVal.classList.toggle('warn', warn);

  const fill = document.getElementById('ring-fill');
  if (fill) {
    fill.style.strokeDashoffset = CIRC * (1 - pct);
    fill.classList.toggle('warn', warn);
  }
}

function onTimerExpired() {
  if (busy) { startMoveTimer(); return; }
  // Лёгкий штраф: мигают все ячейки
  boardEl.querySelectorAll('.cell').forEach(c => {
    c.classList.add('timer-flash');
    setTimeout(() => c.classList.remove('timer-flash'), 900);
  });
  startMoveTimer();
}

// ═══════════════════════════════════════════════════════════════
//  СИСТЕМА ЗАКАЗОВ
// ═══════════════════════════════════════════════════════════════
function startNewOrder() {
  // Выбираем случайный тип детали из активного пула
  orderGem   = Math.floor(Math.random() * GEM_TYPES) + 1;
  // Количество растёт с очками
  const progress = Math.min(score / 500, 1);
  orderTotal = Math.round(ORDER_MIN + progress * (ORDER_MAX - ORDER_MIN));
  orderDone  = 0;
  isRest     = false;
  renderOrderBar();
}

function onOrderComplete() {
  stopMoveTimer();
  ordersCompleted++;

  // Каждый 5-й заказ — новая деталь в пул
  if (ordersCompleted % 5 === 0 && GEM_TYPES < Math.min(POOL_MAX, ALL_IMGS.length)) {
    GEM_TYPES++;
    refreshGemImgs();
    // Пересчитываем таймер с учётом нового пула
    const newName = ALL_NAMES[GEM_TYPES - 1] ?? `Деталь ${GEM_TYPES}`;
    showGemToast(newName);
  }

  isRest   = true;
  restLeft = REST_TIME;
  renderOrderBar();

  restInt = setInterval(() => {
    restLeft--;
    renderOrderBar();
    if (restLeft <= 0) {
      stopRest();
      startNewOrder();
      startMoveTimer();
    }
  }, 1000);
}

function stopRest() {
  if (restInt) { clearInterval(restInt); restInt = null; }
  isRest = false;
}

function renderOrderBar() {
  if (isRest) {
    // Прогрессбар отдыха: жёлтая заливка убывает от 100% до 0%
    const pctRest = (restLeft / REST_TIME * 100).toFixed(1);
    orderBarEl.innerHTML = `
      <div class="order-fill-bg" id="order-fill-bg" style="width:${pctRest}%"></div>
      <div class="order-content">
        <div class="order-text-wrap" style="justify-content:center;gap:6px;">
          <span style="font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#0c0c10;">Перерыв — следующий заказ через</span>
          <span style="font-size:0.72rem;font-weight:700;color:#0c0c10;font-variant-numeric:tabular-nums;">${restLeft}</span>
        </div>
      </div>`;
    return;
  }

  // Активный заказ — без прогрессбара, чистая плашка
  const img  = gemImgs[orderGem - 1];
  const name = ALL_NAMES[orderGem - 1] ?? `Деталь ${orderGem}`;

  orderBarEl.innerHTML = `
    <div class="order-content">
      <div class="order-preview" id="order-preview"></div>
      <div class="order-text-wrap">
        <span class="order-name">${name}</span>
        <span class="order-count">${orderDone}&nbsp;/&nbsp;${orderTotal}</span>
      </div>
    </div>`;

  // превью — кликабельное
  const preview = document.getElementById('order-preview');
  preview.style.cursor = 'pointer';
  preview.title = 'Нажми чтобы рассмотреть';
  preview.onclick = () => openPreview(orderGem);
  if (img) {
    const im = new Image(); im.src = img;
    im.onload = () => { preview.innerHTML = ''; preview.appendChild(im); };
    im.onerror = () => {
      preview.innerHTML = `<span class="fb" style="color:${GEM_COLORS[orderGem-1]}">${GEM_FALLBACK[orderGem-1]}</span>`;
    };
  } else {
    preview.innerHTML = `<span class="fb" style="color:${GEM_COLORS[orderGem-1]}">${GEM_FALLBACK[orderGem-1]}</span>`;
  }
}

// ═══════════════════════════════════════════════════════════════
//  ПРОГРЕССИВНЫЙ ПУЛ
//  Новая деталь появляется каждый 5-й завершённый заказ.
// ═══════════════════════════════════════════════════════════════
function checkPoolGrowth(prevScore) {
  // оставляем пустой — логика перенесена в onOrderComplete
}

// ═══════════════════════════════════════════════════════════════
//  РЕНДЕР
// ═══════════════════════════════════════════════════════════════
function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      boardEl.appendChild(createCell(r, c));
  attachPointerEvents();
}

function createCell(r, c) {
  const g   = board[r][c];
  const div = document.createElement('div');
  div.className = `cell gem-${g}`;
  div.dataset.r = r;
  div.dataset.c = c;
  const src = gemImgs[g - 1];
  if (src) {
    const img = document.createElement('img');
    img.src = src; img.alt = '';
    img.onerror = () => {
      if (!div.isConnected) return;
      img.remove();
      const fb = document.createElement('span'); fb.className = 'fb';
      fb.textContent = GEM_FALLBACK[g-1];
      fb.style.color = GEM_COLORS[g-1];
      div.appendChild(fb);
    };
    div.appendChild(img);
  } else {
    const fb = document.createElement('span'); fb.className = 'fb';
    fb.textContent = GEM_FALLBACK[g-1]; fb.style.color = GEM_COLORS[g-1];
    div.appendChild(fb);
  }
  return div;
}

function getCell(r, c) { return boardEl.children[r * COLS + c] || null; }
function updateCell(r, c) { const o = getCell(r,c); if(o) boardEl.replaceChild(createCell(r,c), o); }

function renderCascade(prevBoard) {
  const cellH = getCell(0,0)?.getBoundingClientRect().height || 42;
  for (let c = 0; c < COLS; c++) {
    const prevVals = [];
    for (let r = 0; r < ROWS; r++) { if (prevBoard[r][c] !== 0) prevVals.push({ val: prevBoard[r][c], row: r }); }
    const usedIdx = {};
    for (let r = 0; r < ROWS; r++) {
      const v    = board[r][c];
      const cell = getCell(r, c); if (!cell) continue;
      const si   = usedIdx[v] ?? 0;
      let foundRow = -1;
      for (let i = si; i < prevVals.length; i++) {
        if (prevVals[i].val === v) { foundRow = prevVals[i].row; usedIdx[v] = i+1; break; }
      }

      const fresh = createCell(r, c);

      if (foundRow === r) {
        // Деталь не двигалась — просто заменяем DOM-узел (сбрасывает pop-анимацию)
        boardEl.replaceChild(fresh, cell);
      } else {
        // Деталь упала — анимируем
        fresh.style.setProperty('--fall-from', foundRow >= 0
          ? `${(foundRow - r) * (cellH + 3)}px`
          : `${-(r + 1) * (cellH + 3)}px`);
        fresh.classList.add('fall-in');
        fresh.style.animationDelay = `${c * 16}ms`;
        boardEl.replaceChild(fresh, cell);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
//  POINTER EVENTS
// ═══════════════════════════════════════════════════════════════
let touchStart = null, eventsAttached = false;

function attachPointerEvents() {
  if (eventsAttached) return;
  eventsAttached = true;
  boardEl.addEventListener('pointerdown', onDown, { passive: false });
  boardEl.addEventListener('pointermove', onMove, { passive: false });
  boardEl.addEventListener('pointerup',   onUp,   { passive: false });
}

function cellFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const c  = el?.closest('.cell');
  return c ? { r: +c.dataset.r, c: +c.dataset.c } : null;
}

function onDown(e) {
  if (busy) return; e.preventDefault();
  hideHint();
  const pos = cellFromPoint(e.clientX, e.clientY);
  if (!pos) return;
  touchStart = pos; selectCell(pos.r, pos.c);
}
function onMove(e) { if (touchStart && !busy) e.preventDefault(); }
function onUp(e) {
  if (!touchStart || busy) return; e.preventDefault();
  const pos = cellFromPoint(e.clientX, e.clientY);
  if (pos && (pos.r !== touchStart.r || pos.c !== touchStart.c)) {
    const dr = pos.r - touchStart.r, dc = pos.c - touchStart.c;
    const nr = touchStart.r + Math.sign(dr) * (Math.abs(dr) >= Math.abs(dc) ? 1 : 0);
    const nc = touchStart.c + Math.sign(dc) * (Math.abs(dc) >  Math.abs(dr) ? 1 : 0);
    if (isInBounds(nr, nc)) { clearSelection(); trySwap(touchStart.r, touchStart.c, nr, nc); }
  }
  touchStart = null;
}

// ═══════════════════════════════════════════════════════════════
//  ВЫБОР И СВАП
// ═══════════════════════════════════════════════════════════════
function selectCell(r, c) {
  if (selected) {
    const { r: sr, c: sc } = selected;
    if (sr === r && sc === c) { clearSelection(); return; }
    if (isNeighbour(sr, sc, r, c)) { clearSelection(); trySwap(sr, sc, r, c); return; }
    clearSelection();
  }
  selected = { r, c };
  getCell(r, c)?.classList.add('selected');
}
function clearSelection() {
  if (selected) getCell(selected.r, selected.c)?.classList.remove('selected');
  selected = null;
}
function isNeighbour(r1,c1,r2,c2) { return Math.abs(r1-r2)+Math.abs(c1-c2)===1; }
function isInBounds(r,c) { return r>=0&&r<ROWS&&c>=0&&c<COLS; }

async function trySwap(r1,c1,r2,c2) {
  busy = true;
  swapData(r1,c1,r2,c2);
  const valid = findMatches(board).length > 0;
  swapData(r1,c1,r2,c2);

  if (!valid) {
    await animateSwap3D(r1,c1,r2,c2, true);
    busy = false;
    resetHintTimer();
    return;
  }

  // Валидный ход — обнуляем таймер
  resetMoveTimer();
  await animateSwap3D(r1,c1,r2,c2, false);
  swapData(r1,c1,r2,c2);
  updateCell(r1,c1); updateCell(r2,c2);

  await processMatches(1);
  busy = false;
  resetHintTimer();
  if (!hasValidMove(board)) noMovesEl.classList.add('visible');
}
function swapData(r1,c1,r2,c2) { [board[r1][c1],board[r2][c2]]=[board[r2][c2],board[r1][c1]]; }

// ═══════════════════════════════════════════════════════════════
//  АНИМАЦИЯ СВАПА
// ═══════════════════════════════════════════════════════════════
async function animateSwap3D(r1,c1,r2,c2, revert) {
  const cell1 = getCell(r1,c1), cell2 = getCell(r2,c2);
  if (!cell1||!cell2) return;
  const rect1 = cell1.getBoundingClientRect(), rect2 = cell2.getBoundingClientRect();
  const fly1 = makeFlyingCard(cell1,rect1), fly2 = makeFlyingCard(cell2,rect2);
  document.body.appendChild(fly1); document.body.appendChild(fly2);
  cell1.classList.add('swap-ghost'); cell2.classList.add('swap-ghost');

  const dx=rect2.left-rect1.left, dy=rect2.top-rect1.top;
  const arc=-Math.max(Math.abs(dx),Math.abs(dy))*0.28;
  const TL=90,TM=185,TD=78,S=1.17;
  const SH0='0 2px 6px rgba(0,0,0,0.3)';
  const SH1='0 10px 26px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.12)';
  const SH2='0 18px 38px rgba(0,0,0,0.65),0 0 12px rgba(255,255,255,0.08)';
  const o=(e,d)=>({duration:d,easing:e,fill:'forwards'});
  const an=(el,kf,d,e)=>el.animate(kf,o(e,d)).finished;

  await Promise.all([
    an(fly1,[{transform:`scale(1) translateZ(0)`,boxShadow:SH0},{transform:`scale(${S}) translateZ(20px)`,boxShadow:SH1}],TL,'ease-out'),
    an(fly2,[{transform:`scale(1) translateZ(0)`,boxShadow:SH0},{transform:`scale(${S}) translateZ(20px)`,boxShadow:SH1}],TL,'ease-out'),
  ]);
  await Promise.all([
    an(fly1,[{transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},{transform:`scale(${S}) translateZ(28px) translate(${dx*.5}px,${dy*.5+arc}px)`,boxShadow:SH2,offset:.5},{transform:`scale(${S}) translateZ(20px) translate(${dx}px,${dy}px)`,boxShadow:SH1}],TM,'ease-in-out'),
    an(fly2,[{transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},{transform:`scale(${S}) translateZ(28px) translate(${-dx*.5}px,${-dy*.5+arc}px)`,boxShadow:SH2,offset:.5},{transform:`scale(${S}) translateZ(20px) translate(${-dx}px,${-dy}px)`,boxShadow:SH1}],TM,'ease-in-out'),
  ]);
  await Promise.all([
    an(fly1,[{transform:`scale(${S}) translateZ(20px) translate(${dx}px,${dy}px)`,boxShadow:SH1},{transform:`scale(1) translateZ(0) translate(${dx}px,${dy}px)`,boxShadow:SH0}],TD,'ease-in'),
    an(fly2,[{transform:`scale(${S}) translateZ(20px) translate(${-dx}px,${-dy}px)`,boxShadow:SH1},{transform:`scale(1) translateZ(0) translate(${-dx}px,${-dy}px)`,boxShadow:SH0}],TD,'ease-in'),
  ]);

  if (revert) {
    await delay(48);
    await Promise.all([
      an(fly1,[{transform:`scale(1) translateZ(0) translate(${dx}px,${dy}px)`,boxShadow:SH0},{transform:`scale(${S}) translateZ(20px) translate(${dx}px,${dy}px)`,boxShadow:SH1}],TL,'ease-out'),
      an(fly2,[{transform:`scale(1) translateZ(0) translate(${-dx}px,${-dy}px)`,boxShadow:SH0},{transform:`scale(${S}) translateZ(20px) translate(${-dx}px,${-dy}px)`,boxShadow:SH1}],TL,'ease-out'),
    ]);
    await Promise.all([
      an(fly1,[{transform:`scale(${S}) translateZ(20px) translate(${dx}px,${dy}px)`,boxShadow:SH1},{transform:`scale(${S}) translateZ(28px) translate(${dx*.5}px,${dy*.5+arc}px)`,boxShadow:SH2,offset:.5},{transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1}],TM,'ease-in-out'),
      an(fly2,[{transform:`scale(${S}) translateZ(20px) translate(${-dx}px,${-dy}px)`,boxShadow:SH1},{transform:`scale(${S}) translateZ(28px) translate(${-dx*.5}px,${-dy*.5+arc}px)`,boxShadow:SH2,offset:.5},{transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1}],TM,'ease-in-out'),
    ]);
    await Promise.all([
      an(fly1,[{transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},{transform:`scale(1) translateZ(0) translate(0,0)`,boxShadow:SH0}],TD,'ease-in'),
      an(fly2,[{transform:`scale(${S}) translateZ(20px) translate(0,0)`,boxShadow:SH1},{transform:`scale(1) translateZ(0) translate(0,0)`,boxShadow:SH0}],TD,'ease-in'),
    ]);
  }
  fly1.remove(); fly2.remove();
  cell1.classList.remove('swap-ghost'); cell2.classList.remove('swap-ghost');
}

function makeFlyingCard(cell, rect) {
  const fly = document.createElement('div');
  fly.className = `flying-card ${[...cell.classList].find(cl=>cl.startsWith('gem-'))||'gem-1'}`;
  fly.style.cssText = `left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;transform-origin:center center;`;
  fly.innerHTML = cell.innerHTML;
  return fly;
}

// ═══════════════════════════════════════════════════════════════
//  МАТЧИ И КАСКАДЫ
// ═══════════════════════════════════════════════════════════════
function findMatches(b) {
  const set = new Set();
  for(let r=0;r<ROWS;r++){let run=1;for(let c=1;c<COLS;c++){if(b[r][c]===b[r][c-1]){run++;if(run===3){set.add(`${r},${c-2}`);set.add(`${r},${c-1}`);set.add(`${r},${c}`);}else if(run>3)set.add(`${r},${c}`);}else run=1;}}
  for(let c=0;c<COLS;c++){let run=1;for(let r=1;r<ROWS;r++){if(b[r][c]===b[r-1][c]){run++;if(run===3){set.add(`${r-2},${c}`);set.add(`${r-1},${c}`);set.add(`${r},${c}`);}else if(run>3)set.add(`${r},${c}`);}else run=1;}}
  return [...set].map(k=>{const[r,c]=k.split(',');return{r:+r,c:+c};});
}

async function processMatches(combo) {
  const matches = findMatches(board);
  if (!matches.length) return;

  const prevScore = score;
  score += matches.length * 10 * combo;
  scoreEl.textContent = score.toLocaleString();
  if (combo > 1) showComboToast(combo);

  // Учитываем попадания в заказ
  if (!isRest) {
    const hits = matches.filter(m => board[m.r][m.c] === orderGem).length;
    if (hits > 0) {
      orderDone = Math.min(orderDone + hits, orderTotal);
      renderOrderBar();
      if (orderDone >= orderTotal) onOrderComplete();
    }
  }

  // Проверяем рост пула
  checkPoolGrowth(prevScore);

  for (const {r,c} of matches) { getCell(r,c)?.classList.add('matched'); board[r][c] = 0; }
  await delay(280);

  const prev = deepCopy(board);
  applyGravity(); fillBoard();
  renderCascade(prev);
  await delay(410);

  await processMatches(combo + 1);
}

function applyGravity() {
  for(let c=0;c<COLS;c++){let e=ROWS-1;for(let r=ROWS-1;r>=0;r--){if(board[r][c]!==0){board[e][c]=board[r][c];if(e!==r)board[r][c]=0;e--;}}while(e>=0){board[e][c]=0;e--;}}
}
function fillBoard() {
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(board[r][c]===0) board[r][c]=randomGem();
}

// ═══════════════════════════════════════════════════════════════
//  ПОДСКАЗКА
// ═══════════════════════════════════════════════════════════════
function onHintToggle() {
  hintEnabled = document.getElementById('hint-toggle').checked;
  if (!hintEnabled) {
    hideHint();
  } else {
    // Сразу показываем подсказку, потом таймер 10с при бездействии
    showHint();
  }
}
function resetHintTimer() {
  hideHint();
  if (!hintEnabled) return;
  hintTimer = setTimeout(showHint, HINT_IDLE_MS);
}
function hideHint() {
  if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  boardEl.querySelectorAll('.cell.hint').forEach(c => c.classList.remove('hint'));
}
function showHint() {
  if (!hintEnabled || busy) { return; }
  if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  // Снимаем старую подсказку
  boardEl.querySelectorAll('.cell.hint').forEach(c => c.classList.remove('hint'));
  // Ищем первый валидный ход
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    if (c+1<COLS) { const cp=deepCopy(board);[cp[r][c],cp[r][c+1]]=[cp[r][c+1],cp[r][c]];if(findMatches(cp).length>0){applyHint(r,c,r,c+1);return;} }
    if (r+1<ROWS) { const cp=deepCopy(board);[cp[r][c],cp[r+1][c]]=[cp[r+1][c],cp[r][c]];if(findMatches(cp).length>0){applyHint(r,c,r+1,c);return;} }
  }
}
function applyHint(r1,c1,r2,c2) {
  getCell(r1,c1)?.classList.add('hint');
  getCell(r2,c2)?.classList.add('hint');
  // Через 10с — следующая подсказка при бездействии
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(showHint, HINT_IDLE_MS);
}

// ═══════════════════════════════════════════════════════════════
//  ХОДЫ / ПЕРЕМЕШИВАНИЕ
// ═══════════════════════════════════════════════════════════════
function hasValidMove(b) {
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(c+1<COLS){const cp=deepCopy(b);[cp[r][c],cp[r][c+1]]=[cp[r][c+1],cp[r][c]];if(findMatches(cp).length>0)return true;}
    if(r+1<ROWS){const cp=deepCopy(b);[cp[r][c],cp[r+1][c]]=[cp[r+1][c],cp[r][c]];if(findMatches(cp).length>0)return true;}
  }
  return false;
}
function deepCopy(b) { return b.map(r=>[...r]); }

function shuffleBoard() {
  noMovesEl.classList.remove('visible');
  do { for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) board[r][c]=randomGem(); }
  while(findMatches(board).length>0||!hasValidMove(board));
  renderBoard(); busy=false;
  resetMoveTimer(); resetHintTimer();
}

// ═══════════════════════════════════════════════════════════════
//  СКРЕБОК
// ═══════════════════════════════════════════════════════════════
let scraperActive=false, scraperDrag=false, scraperAxis=null;
let scraperIndex=null, scraperOrigin=null, scraperVisited=new Set();
const scraperBtn = document.getElementById('scraper-btn');

function toggleScraper() {
  scraperActive = !scraperActive;
  scraperBtn.classList.toggle('active', scraperActive);
  clearScraperHL();
  if (scraperActive) hideHint(); else resetHintTimer();
}
function clearScraperHL() {
  boardEl.querySelectorAll('.cell.scraper-hover').forEach(c=>c.classList.remove('scraper-hover'));
  scraperDrag=false; scraperAxis=null; scraperIndex=null; scraperOrigin=null; scraperVisited=new Set();
}
function scraperDown(e) {
  if (!scraperActive||busy) return;
  const pos=cellFromPoint(e.clientX,e.clientY); if(!pos) return;
  scraperDrag=true; scraperOrigin=pos; scraperAxis=null; scraperIndex=null; scraperVisited.clear();
  hlScraper(pos.r,pos.c);
}
function scraperMove(e) {
  if (!scraperDrag||!scraperActive||busy) return; e.preventDefault();
  const pos=cellFromPoint(e.clientX,e.clientY); if(!pos) return;
  if (scraperAxis===null&&scraperOrigin) {
    const dr=Math.abs(pos.r-scraperOrigin.r),dc=Math.abs(pos.c-scraperOrigin.c);
    if(dr===0&&dc===0) return;
    scraperAxis = dr>=dc ? 'col' : 'row';
    scraperIndex = scraperAxis==='col' ? scraperOrigin.c : scraperOrigin.r;
  }
  if (scraperAxis===null) return;
  if (scraperAxis==='row') hlScraper(scraperIndex,pos.c); else hlScraper(pos.r,scraperIndex);
}
async function scraperUp(e) {
  if (!scraperDrag||!scraperActive||busy) return;
  scraperDrag=false;
  if (scraperAxis===null||scraperIndex===null||scraperVisited.size<3) { clearScraperHL(); return; }
  busy=true;
  const cells = scraperAxis==='row'
    ? Array.from({length:COLS},(_,c)=>getCell(scraperIndex,c))
    : Array.from({length:ROWS},(_,r)=>getCell(r,scraperIndex));
  cells.forEach((cell,i)=>{ if(!cell) return; cell.classList.remove('scraper-hover'); cell.style.animationDelay=`${i*28}ms`; cell.classList.add('scrape-out'); });
  await delay(220+COLS*28);
  if (scraperAxis==='row') for(let c=0;c<COLS;c++) board[scraperIndex][c]=0;
  else for(let r=0;r<ROWS;r++) board[r][scraperIndex]=0;
  clearScraperHL();
  const prev=deepCopy(board); applyGravity(); fillBoard(); renderCascade(prev);
  await delay(410);
  await processMatches(1);
  scraperActive=false; scraperBtn.classList.remove('active');
  busy=false; resetMoveTimer(); resetHintTimer();
  if (!hasValidMove(board)) noMovesEl.classList.add('visible');
}
function hlScraper(r,c) {
  const key=`${r},${c}`; if(scraperVisited.has(key)) return; scraperVisited.add(key);
  getCell(r,c)?.classList.add('scraper-hover');
}

boardEl.addEventListener('pointerdown',(e)=>{ if(scraperActive){e.stopImmediatePropagation();scraperDown(e);}},{capture:true,passive:false});
boardEl.addEventListener('pointermove',(e)=>{ if(scraperActive&&scraperDrag){e.stopImmediatePropagation();scraperMove(e);}},{capture:true,passive:false});
boardEl.addEventListener('pointerup',  (e)=>{ if(scraperActive){e.stopImmediatePropagation();scraperUp(e);}  },{capture:true,passive:false});

// ═══════════════════════════════════════════════════════════════
//  ТОСТЫ
// ═══════════════════════════════════════════════════════════════
let comboHideT=null, gemHideT=null;

function showToast(el, hideFn, ms=1100) {
  el.classList.remove('show','hide');
  void el.offsetWidth;
  el.classList.add('show');
  if (hideFn._t) clearTimeout(hideFn._t);
  hideFn._t = setTimeout(()=>{ el.classList.remove('show'); el.classList.add('hide'); }, ms);
}

function showComboToast(level) {
  comboVal.textContent = `×${level}`;
  showToast(comboToast, showComboToast, 950);
}
showComboToast._t = null;

function showGemToast(name) {
  gemToastNm.textContent = name;
  showToast(gemToast, showGemToast, 2400);
}
showGemToast._t = null;

// ═══════════════════════════════════════════════════════════════
//  УТИЛИТЫ
// ═══════════════════════════════════════════════════════════════
function delay(ms) { return new Promise(r=>setTimeout(r,ms)); }

// ═══════════════════════════════════════════════════════════════
//  PREVIEW MODAL
// ═══════════════════════════════════════════════════════════════
function openPreview(gemIdx) {
  const modal   = document.getElementById('preview-modal');
  const imgWrap = document.getElementById('preview-img-wrap');
  const nameEl  = document.getElementById('preview-name');

  const src  = gemImgs[gemIdx - 1];
  const name = ALL_NAMES[gemIdx - 1] ?? `Деталь ${gemIdx}`;

  imgWrap.innerHTML = '';
  nameEl.textContent = name;

  if (src) {
    const im = new Image();
    im.src = src;
    im.onload = () => { imgWrap.innerHTML = ''; imgWrap.appendChild(im); };
    im.onerror = () => {
      imgWrap.innerHTML = `<span class="fb" style="color:${GEM_COLORS[gemIdx-1]}">${GEM_FALLBACK[gemIdx-1]}</span>`;
    };
    // показываем пока грузится
    imgWrap.appendChild(im);
  } else {
    imgWrap.innerHTML = `<span class="fb" style="color:${GEM_COLORS[gemIdx-1]}">${GEM_FALLBACK[gemIdx-1]}</span>`;
  }

  modal.classList.add('visible');
}

function closePreview() {
  document.getElementById('preview-modal').classList.remove('visible');
}

// ── Старт ──
// Грузим gem_names.json, потом запускаем игру
fetch('./gem_names.json')
  .then(r => r.json())
  .then(data => {
    // Перемешиваем детали случайно чтобы каждая игра была разной
    const entries = Object.entries(data);
    for (let i = entries.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [entries[i], entries[j]] = [entries[j], entries[i]];
    }
    ALL_NAMES = entries.map(([name]) => name);
    ALL_IMGS  = entries.map(([, file]) => file);
    // POOL_MAX не больше реального числа деталей
    Object.defineProperty(window, '_POOL_MAX_REAL', { value: Math.min(POOL_MAX, ALL_IMGS.length) });
    init();
  })
  .catch(() => {
    // Если JSON не загрузился — фоллбэк на пустые имена
    console.warn('gem_names.json не найден — детали без имён');
    ALL_NAMES = Array.from({ length: 42 }, (_, i) => `Деталь ${i+1}`);
    ALL_IMGS  = [];
    init();
  });
</script>
